# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-solarcare"
BBFILE_PATTERN_meta-solarcare = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-solarcare = "6"

LAYERDEPENDS_meta-solarcare = "core"
LAYERSERIES_COMPAT_meta-solarcare = "wrynose"
